name: terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']

# OIDC needs id-token write. contents read is the least the checkout needs.
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: diagnose
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "NO OIDC TOKEN ENDPOINT — permissions not taking effect"
          else
            echo "OIDC token endpoint present"
          fi
          ROLE='${{ vars.AWS_ROLE_ARN }}'
          echo "role length: ${#ROLE}"
          echo "role tail: ${ROLE: -40}"
          echo "repo: ${{ github.repository }}"
          echo "sub would be: repo:${{ github.repository }}:pull_request"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="budget_alert_email=${{ secrets.BUDGET_EMAIL }}"
        continue-on-error: true

      - name: summary
        run: |
          echo '## Terraform plan' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.plan.outputs.stdout }}" | tail -c 60000 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1